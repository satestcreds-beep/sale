<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Domain for Sale</title>
  <style>
    :root {
      --paper: #f5f0e7;
      --ink: #171411;
      --brown: #6b4430;
      --line: #cdbfaf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 680px);
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      padding: clamp(3rem, 9vw, 6.5rem) 0;
    }

    .label {
      margin: 0 0 1.5rem;
      color: var(--brown);
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 10ch;
      margin: 0;
      font-size: clamp(3.25rem, 10vw, 6.5rem);
      font-weight: 400;
      letter-spacing: -0.07em;
      line-height: 0.9;
    }

    p {
      max-width: 34rem;
      margin: 2rem 0 0;
      border-left: 1px solid var(--line);
      padding-left: 1.25rem;
      font-size: 1.15rem;
      line-height: 1.55;
    }

    a {
      color: var(--brown);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.22em;
    }

    a:hover {
      color: var(--ink);
    }
  </style>
</head>

<body>
  <main>
    <div class="label">Available</div>
    <h1>This domain is for sale.</h1>
    <p>
      Interested in making it yours ?
      <a href="https://www.linkedin.com/in/mandeepkumarbanihall/" target="_blank" rel="noopener"
        style="text-decoration: none;">
        <i>Connect on LinkedIn</i>
      </a>
    </p>
  </main </body>

</html>
